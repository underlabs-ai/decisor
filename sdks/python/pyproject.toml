[project]
name = "decisor"
version = "0.1.0"
description = "Minimal Decisor client: typed decisions over an SGLang engine."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
decisor-cli = "decisor_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["decisor.py", "decisor_cli.py"]
